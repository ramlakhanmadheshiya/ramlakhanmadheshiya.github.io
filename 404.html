<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · theramlakhan.com</title>
<!-- Forgiving addresses: any case, with or without dashes, old paths. route.js
     (from the Brainnova Studio site) redirects when it recognises the address. -->
<script src="/BrainnovaStudio/assets/route.js"></script>
<style>
  :root { --bg: #fbfbfd; --ink: #1d1d1f; --muted: #6e6e73; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f5f5f7; --muted: #98989d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: clamp(40px, 8vw, 72px); letter-spacing: -.045em; margin: 8px 0 12px; }
  p { color: var(--muted); margin: 0 0 26px; }
  a { display: inline-block; padding: 14px 24px; border-radius: 99px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; margin: 4px; }
  a.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 15%, transparent); }
  [hidden] { display: none; }
</style>
</head>
<body>
<main data-route-miss hidden>
  <p style="margin:0">404</p>
  <h1>This page wandered off.</h1>
  <p>It may have moved, or never existed.</p>
  <a href="/">Home</a><a class="ghost" href="/BrainnovaStudio/games/">Games</a>
</main>
</body>
</html>
